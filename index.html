<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moonbucks</title>
    <link rel="stylesheet" href="./styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
</head>

<body>
    <nav class="navbar">
        <div class="navbar_container">
            <a href="#home" id="navbar_logo"><img src="assets/images/app_logo.png" alt="moonbucks logo"></a>

            <div class="navbar_toggle" id="mobile-menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>

            <ul class="navbar_menu">
                <li class="navbar_item home active">
                    <a class="navbar_link" id="home-link">Home</a>
                </li>
                <li class="navbar_item menu">
                    <a href="#menu" class="navbar_link" id="menu-link">Menu</a>
                </li>
                <li class="navbar_item about">
                    <a href="#about" class="navbar_link" id="about-link">About</a>
                </li>
                <li class="navbar_item contact">
                    <a href="#contact" class="navbar_link" id="contact-link">Contact</a>
                </li>
                <li class="navbar_button sign-up">
                    <a href="#sign-up" class="button" id="sign-up-link">Sign Up</a>
                </li>
            </ul>
        </div>
    </nav>

    <section id="home">
        <div class="hero">
            <div class="hero_container">
                <div class="hero_footage_container">
                    <video autoplay muted loop id="hero-footage">
                        <source src="./assets/videos/hero/coffee-footage.mp4" type="video/mp4">
                    </video>
                </div>
                <h1 class="hero_heading">Discover Your Favorites</h1>
                <br>
                <p class="hero_description">Authentic Signature Coffee</p>
            </div>
        </div>
    </section>

    <section id="menu"></section>
    <section id="about"></section>
    <section id="contact"></section>
    <!-- <section id="sign-up"></section> -->

    <script src="./app.js"></script>
</body>

</html>
